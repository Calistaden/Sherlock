<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scotland Yard</title>

<style>
body {
  margin: 0;
  font-family: "Georgia", serif;
  background: #f3e8c9 url('https://upload.wikimedia.org/wikipedia/commons/0/0e/Old_paper_background.jpg') repeat;
  color: #2a2a2a;
  padding: 40px 20px;
  text-align: center;
  box-sizing: border-box;
}

.container {
  max-width: 900px;
  margin: auto;
  background: rgba(255, 255, 255, 0.85);
  padding: 30px 20px;
  border: 2px solid #3b2f2f;
  border-radius: 8px;
  box-shadow: 0 0 10px rgba(0,0,0,0.4);
}

h1 {
  font-size: 3rem;
  margin-bottom: 10px;
}

h2 {
  font-size: 1.6rem;
  margin-top: 0;
  font-style: italic;
}

p {
  font-size: 1.1rem;
  line-height: 1.6;
}

.video-wrapper {
  margin-top: 30px;
}

video, iframe {
  width: 100%;
  max-width: 800px;
  border: 3px solid #3b2f2f;
  border-radius: 6px;
  box-shadow: 0 0 8px rgba(0,0,0,0.5);
}

.btn {
  display: inline-block;
  margin-top: 25px;
  padding: 15px 25px;
  font-size: 1.2rem;
  background: #3b2f2f;
  color: #fff;
  text-decoration: none;
  border-radius: 5px;
  transition: 0.2s;
}

.btn:hover {
  background: #2a2121;
}

/* Responsive */
@media(max-width: 600px){
  body {
    padding: 20px 10px;
  }
  .container {
    padding: 20px 15px;
  }
  h1 {
    font-size: 2rem;
  }
  h2 {
    font-size: 1.2rem;
  }
  p {
    font-size: 1rem;
  }
  .btn {
    padding: 12px 20px;
    font-size: 1rem;
    margin-top: 20px;
  }
}
</style>
</head>

<body>

<div class="container">
<h1>Scotland Yard</h1>
<h2>Rencontre avec l'enquêteur</h2>

<p>
Votre groupe de détectives vient d'arriver par bateau en provenance du Havre<br>
Vous avez été convoqués par Scotland Yard sur ordre de la reine d'Angleterre.
</p>

<div class="video-wrapper">

<!-- OPTION 1 : Vidéo locale -->
<!--

  <source src="Sherlock13Mars.mp4" type="video/mp4">
  Votre navigateur ne supporte pas la lecture vidéo.
</video>
-->

<!-- OPTION 2 : Vidéo YouTube (décommente si besoin) -->
<iframe height="450"
src="https://www.youtube.com/embed/gYFQUQ_WFsk"
title="Vidéo enquête"
frameborder="0"
allowfullscreen>
</iframe>


</div>
</div>

</body>

</html>
