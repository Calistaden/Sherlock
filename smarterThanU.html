<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMARTER THAN U</title>

<style>
body {
    background-color: #111;
    margin: 0;
    font-family: "Courier New", monospace;
    color: #33ff66;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.terminal {
    background-color: #000;
    padding: 20px;
    width: 100%;
    max-width: 600px;
}

.title {
    text-align: center;
    font-size: clamp(18px, 5vw, 26px);
    letter-spacing: 2px;
}

.separator {
    border-top: 2px solid #33ff66;
    margin: 12px 0 20px;
}

.row {
    display: flex;
    align-items: baseline;
    margin: 10px 0;
}

.label {
    white-space: nowrap;
    margin-right: 6px;
}

.input {
    flex: 1;
    min-height: 18px;
    outline: none;
    white-space: pre-wrap;
    word-break: break-word;
}

.cursor {
    display: inline-block;
    width: 9px;
    height: 16px;
    background-color: #33ff66;
    margin-left: 1px;
    animation: blink 1s steps(1) infinite;
    vertical-align: bottom;
}

@keyframes blink {
    50% { opacity: 0; }
}

.message {
    margin: 16px 0;
    min-height: 18px;
}

.error { color: #ff5555; }
.success { font-weight: bold; }

.buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    font-size: 13px;
}
</style>
</head>

<body>
<div class="terminal">
    <div class="title">SMARTER THAN U</div>
    <div class="separator"></div>

    <div class="row">
        <div class="label">Login . . . . . :</div>
        <div>MORIARTY</div>
    </div>

    <div class="row">
        <div class="label">Password . . . :</div>
        <div class="input" id="password" tabindex="0"><span id="text"></span><span class="cursor"></span></div>
    </div>

    <div class="message" id="message"></div>

    <div class="buttons">
        <div>F2 = Reset</div>
        <div>ENTER = Validate</div>
        <div>F12 = Cancel</div>
    </div>
</div>

<script>
const passwordDiv = document.getElementById("password");
const textSpan = document.getElementById("text");
const message = document.getElementById("message");

const errorMessages = [
    ">>> Password incorrect : Si vous vous trompez encore vous allez vous en mordre les dents !",
    ">>> Password incorrect : Même Anissa aurait trouvé !",
    ">>> Password incorrect : Ah vous vous êtes trompés là ? J'avais pas prévu de message d'erreur tellement c'est facile..."
];

passwordDiv.focus();

document.addEventListener("keydown", (e) => {
    if (e.key.length === 1) {
        textSpan.textContent += e.key.toUpperCase();
    }

    if (e.key === "Backspace") {
        textSpan.textContent = textSpan.textContent.slice(0, -1);
        e.preventDefault();
    }

    if (e.key === "Enter") checkPassword();
    if (e.key === "F2") reset();
});

function checkPassword() {
    const value = textSpan.textContent.trim();
    if (value === "BAIGNOIRE") {
        message.textContent = ">>> Bravo, vous avez gagné";
        message.className = "message success";
    } else {
        message.textContent =
            errorMessages[Math.floor(Math.random() * errorMessages.length)];
        message.className = "message error";
    }
}

function reset() {
    textSpan.textContent = "";
    message.textContent = "";
    message.className = "message";
}
</script>
</body>
</html>
